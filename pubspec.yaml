name: picsum_gallery
description: A simple Flutter app listing images from Picsum.photos
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=2.17.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^0.13.6
  provider: ^6.0.5
  cached_network_image: ^3.2.3
  easy_debounce: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

# ... (rest of your file)

flutter:
  uses-material-design: true
  assets:
    - assets/proo.jpg

# THIS PART MUST BE AT THE SAME LEVEL AS 'flutter:', NOT INSIDE IT
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/proo.jpg"
  min_sdk_android: 21
